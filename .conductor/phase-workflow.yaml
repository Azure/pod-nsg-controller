# Conductor Onboarding & TDD Phase Workflow
#
# This workflow orchestrates the full TDD lifecycle for each phase of the
# pod-nsg-controller SPECIFICATION.md. It uses 7 specialized agents in a
# sequential pipeline with feedback loops:
#
#   design → design_review → unit_test_writer → coder → unit_test_validator
#     → integration_tester → qa_validator → $end (or loop back)
#
# Prerequisites:
#   1. Install Conductor:
#      curl -sSfL https://aka.ms/conductor/install.sh | sh
#
#   2. Ensure GitHub Copilot CLI is available (for the copilot provider):
#      gh extension install github/gh-copilot
#
#   3. Run the workflow:
#      conductor run .conductor/phase-workflow.yaml \
#        --input phase="Phase 1: CRD Types, Scaffolding & Scheme Registration" \
#        --input spec_path="docs/SPECIFICATION.md"
#
#   4. With a pre-existing design (skips design + review):
#      conductor run .conductor/phase-workflow.yaml \
#        --input phase="Phase 7: Error Handling, Resilience" \
#        --input spec_path="docs/SPECIFICATION.md" \
#        --input design_path=".conductor/designs/phase-7:-error-handling,-resilience-"
#
#   5. With web dashboard:
#      conductor run .conductor/phase-workflow.yaml --web \
#        --input phase="Phase 1: CRD Types, Scaffolding & Scheme Registration" \
#        --input spec_path="docs/SPECIFICATION.md"
#
# Flow:
#   designer → design_reviewer ──(approved)──→ unit_test_writer
#                ↑  (revise)  ←──(rejected)──┘
#   designer ──(pre-existing design_path)──→ unit_test_writer  [skip review]
#   unit_test_writer → coder → unit_test_validator
#                        ↑  ←──(tests fail)──┘
#   unit_test_validator ──(pass)──→ integration_tester → qa_validator
#                                                          ↓
#                                                  (approved) → $end
#                                                  (rejected) → coder

workflow:
  name: tdd-phase-implementation
  description: >-
    Spec-driven TDD workflow for implementing a single phase of the
    pod-nsg-controller specification. Orchestrates design, review,
    test-first coding, and QA validation.
  version: "1.0.0"
  entry_point: designer

  runtime:
    provider: copilot
    default_model: claude-sonnet-4.6

  input:
    phase:
      type: string
      required: true
      description: >-
        The phase name to implement (e.g., "Phase 1: CRD Types, Scaffolding & Scheme Registration")
    spec_path:
      type: string
      required: true
      description: >-
        Path to the SPECIFICATION.md file (e.g., "docs/SPECIFICATION.md")
    design_path:
      type: string
      required: false
      description: >-
        Path to a pre-existing design document. When provided, the designer
        agent loads this file and skips directly to test writing (bypassing
        design review and approval gate).

  context:
    mode: accumulate

  limits:
    max_iterations: 80

# ═══════════════════════════════════════════════════════════════════
# AGENTS
# ═══════════════════════════════════════════════════════════════════

agents:

  # ─── 1. DESIGN AGENT ─────────────────────────────────────────
  - name: designer
    description: >-
      Reads the spec for the target phase, researches the codebase,
      and produces a detailed implementation design document. When a
      pre-existing design_path is provided, loads it directly and
      skips review.
    model: gpt-5.3-codex
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - workflow.input.design_path?
      - design_reviewer.output?
    system_prompt: |
      You are a Principal Software Architect specializing in Go, Kubernetes
      controllers, and Azure networking. You create precise, codebase-grounded
      implementation designs.

      Project context:
      - Repository: pod-nsg-controller (Go, controller-runtime)
      - Logging: All code must use go.uber.org/zap (uber-go/zap)
      - Controller-runtime code uses logr backed by zapr
      - Azure clients use *zap.Logger directly
      - Tests use zaptest.NewLogger(t)
    prompt: |
      {% if workflow.input.design_path is defined and workflow.input.design_path %}
      ## Pre-existing Design — Load and Extract Metadata

      A design document already exists for this phase. Load it and extract
      the structured metadata so downstream agents can use it.

      **Phase:** {{ workflow.input.phase }}
      **Design File:** Read `{{ workflow.input.design_path }}`

      ## Tasks

      1. **Read the design document** at `{{ workflow.input.design_path }}`

      2. **Extract metadata** from the document:
         - `files_to_create`: list of new file paths from the design (look for
           "Files to create" section). Use an empty list if none.
         - `files_to_modify`: list of existing file paths from the design (look
           for "Files to modify" section)
         - `test_files`: list of test file paths from the design (look for test
           sections listing test files)

      3. **Set outputs:**
         - `design_path` = `{{ workflow.input.design_path }}`
         - `skip_review` = true
         - `revision_notes` = "Pre-existing design loaded, skipping review"

      **CRITICAL:** Do NOT create a new design. Do NOT modify the design file.
      Simply read it and extract the file lists.
      {% else %}
      Create a detailed implementation design for the following phase.

      **Phase:** {{ workflow.input.phase }}
      **Specification:** Read the file at `{{ workflow.input.spec_path }}`

      {% if design_reviewer is defined and design_reviewer.output and not design_reviewer.output.approved %}
      **Design Review Feedback (Score: {{ design_reviewer.output.score }}/100):**
      {{ design_reviewer.output.feedback }}

      **Critical Issues:**
      {% for issue in design_reviewer.output.critical_issues %}
      - {{ issue }}
      {% endfor %}

      IMPORTANT: Revise the existing design to address the feedback.
      Read the previous design from `{{ designer.output.design_path }}`.
      {% endif %}

      ## Tasks

      1. **Read the Specification** — Parse the target phase from SPECIFICATION.md.
         Extract: goal, step-by-step actions, deliverables, type definitions,
         TDD acceptance tests.

      2. **Research the Codebase** — Analyze existing code to understand:
         - Current file structure and Go module layout
         - Existing types, interfaces, and patterns
         - Dependencies (go.mod) and available libraries
         - Conventions (naming, error handling, logging with zap)

      3. **Write Implementation Design** — Produce a document covering:
         - Files to create/modify (exact paths)
         - Go type definitions and function signatures
         - Interface contracts
         - Dependency graph between new and existing code
         - Logging approach (zap fields per operation)
         - Edge cases and error handling strategy
         - Test file locations and test function names

      4. **Save the Design** — Write to `.conductor/designs/{{ workflow.input.phase | replace(' ', '-') | lower }}.design.md`
      {% endif %}
    output:
      design_path:
        type: string
        description: Path where the design document was saved
      files_to_create:
        type: array
        description: List of new files to be created
      files_to_modify:
        type: array
        description: List of existing files to be modified
      test_files:
        type: array
        description: List of test files to be created
      revision_notes:
        type: string
        description: Summary of changes if this is a revision
      skip_review:
        type: boolean
        description: Whether to skip design review (true when using pre-existing design)
    routes:
      - to: unit_test_writer
        when: "{{ output.skip_review }}"
      - to: design_reviewer

  # ─── 2. DESIGN REVIEW AGENT ──────────────────────────────────
  - name: design_reviewer
    description: >-
      Reviews the implementation design for technical accuracy,
      spec compliance, and feasibility.
    model: gpt-5.4
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
    system_prompt: |
      You are a Senior Engineering Reviewer specializing in Go, Kubernetes
      controller-runtime, and Azure SDK. You validate implementation designs
      against specifications.

      You are especially attentive to:
      - Whether the design covers ALL deliverables listed in the spec phase
      - Whether ALL TDD acceptance tests from the spec are accounted for
      - Correctness of Go type definitions and interface contracts
      - Proper use of uber-go/zap logging (not fmt.Printf, not logr without zapr)
      - Feasibility given existing codebase structure
      - Missing edge cases or error handling
    prompt: |
      Review the implementation design for **{{ workflow.input.phase }}**.

      **Specification:** Read `{{ workflow.input.spec_path }}` — focus on the
      target phase section.

      **Design Document:** Read `{{ designer.output.design_path }}`

      ## Evaluation Criteria

      | Criteria | Weight |
      |----------|--------|
      | Spec completeness (all deliverables covered) | 30% |
      | TDD test coverage (all acceptance tests listed) | 25% |
      | Technical correctness (Go types, interfaces) | 20% |
      | Codebase consistency (patterns, conventions, zap) | 15% |
      | Error handling and edge cases | 10% |

      Score 0-100. Approve if score >= 85.
    output:
      score:
        type: number
        description: Design quality score 0-100
      approved:
        type: boolean
        description: Whether the design is approved (score >= 85)
      feedback:
        type: string
        description: Detailed review feedback
      critical_issues:
        type: array
        description: Issues that must be addressed before implementation
    routes:
      - to: design_approval_gate
        when: "{{ output.approved }}"
      - to: designer
        when: "{{ output.score < 85 }}"
      - to: design_approval_gate

  # ─── 2b. HUMAN GATE: Design Approval ─────────────────────────
  - name: design_approval_gate
    type: human_gate
    description: >-
      Human reviews the approved design before TDD test writing begins.
      Allows the operator to inspect the design, request changes, or abort.
    prompt: |
      ## Design Approved — Review Before Implementation

      **Phase:** {{ workflow.input.phase }}
      **Design Score:** {{ design_reviewer.output.score }}/100

      **Design Document:** `{{ designer.output.design_path }}`

      **Files to create:**
      {% for f in designer.output.files_to_create %}
      - `{{ f }}`
      {% endfor %}

      **Files to modify:**
      {% for f in designer.output.files_to_modify %}
      - `{{ f }}`
      {% endfor %}

      **Test files planned:**
      {% for f in designer.output.test_files %}
      - `{{ f }}`
      {% endfor %}

      **Reviewer feedback:** {{ design_reviewer.output.feedback }}
    options:
      - label: Approve — proceed to write failing tests
        value: proceed
        route: unit_test_writer
      - label: Revise design — send back to designer
        value: revise
        route: designer
        prompt_for: feedback
      - label: Abort workflow
        value: abort
        route: $end

  # ─── 3. UNIT TEST WRITER AGENT (TDD: Write Failing Tests) ───
  - name: unit_test_writer
    description: >-
      Writes failing unit tests based on the TDD acceptance criteria
      from the spec. If tests already exist, validates them and only
      adds missing coverage.
    model: claude-opus-4.6
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
    system_prompt: |
      You are a Test Engineer specializing in Go testing, TDD, and Kubernetes
      controller testing (envtest). You write comprehensive tests based on
      spec acceptance criteria.

      Testing conventions for this project:
      - Use standard `testing` package with `t.Run()` subtests
      - Use `zaptest.NewLogger(t)` from go.uber.org/zap/zaptest for test loggers
      - Test naming: `TestPhaseX_Description` or grouped suites
      - Use envtest for CRD/controller tests
      - Use table-driven tests where appropriate
      - Assert with `if got != want { t.Errorf(...) }` pattern (no testify)

      IMPORTANT: Before writing anything, check if test files and test
      functions already exist. Do NOT rewrite existing passing tests.
    prompt: |
      Write or verify unit tests for **{{ workflow.input.phase }}**.

      **Specification:** Read `{{ workflow.input.spec_path }}` — extract the
      TDD Acceptance Tests table for this phase.

      **Design:** Read `{{ designer.output.design_path }}`

      ## Tasks

      1. **Extract ALL acceptance test IDs** from the spec (e.g., T1.1–T1.6)

      2. **Check for existing tests** at the paths specified in the design:
      {% for test_file in designer.output.test_files %}
         - `{{ test_file }}`
      {% endfor %}

      3. **If test files already exist:**
         - Run `go test ./... -v -count=1` to see which tests pass
         - Inventory existing test functions vs. required acceptance tests
         - Only add tests for MISSING acceptance criteria
         - Do NOT modify or rewrite passing tests
         - Report existing coverage alongside any additions

      4. **If test files do NOT exist:**
         - Write test functions for EVERY acceptance criterion
         - Tests must call functions/types that DON'T EXIST YET
         - Create minimal stub files so tests compile but FAIL
         - Run `go test` to confirm tests FAIL

      5. **Run `go test`** to confirm final state

      **CRITICAL:** Never delete or rewrite existing passing tests.
      Only add what is missing.
    output:
      test_files_created:
        type: array
        description: List of test files created or verified
      stub_files_created:
        type: array
        description: List of stub files created (empty if tests already existed)
      test_count:
        type: number
        description: Total number of test functions (existing + new)
      all_tests_fail:
        type: boolean
        description: Whether all NEW tests correctly fail (true if no new tests needed)
      test_output:
        type: string
        description: Output from running go test
      existing_tests_found:
        type: boolean
        description: Whether existing test implementations were found
    routes:
      - to: coder

  # ─── 4. CODER AGENT (Implementation) ─────────────────────────
  - name: coder
    description: >-
      Implements production code to make failing tests pass. If code
      already exists, verifies it and only fixes specific issues from
      upstream feedback.
    model: claude-opus-4.6
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - unit_test_writer.output
      - unit_test_validator.output?
      - qa_validator.output?
    system_prompt: |
      You are a Senior Go Engineer specializing in Kubernetes controllers
      and Azure SDK integration. You write clean, production-ready Go code
      following existing codebase patterns.

      Coding standards:
      - All logging via go.uber.org/zap (uber-go/zap)
        - Controller code: logr.Logger backed by zapr
        - Azure clients: *zap.Logger directly
        - Use typed field constructors: zap.String, zap.Int, zap.Error
      - Error handling: wrap with fmt.Errorf("context: %w", err)
      - No fmt.Printf or log.Println
      - Follow existing naming conventions in the codebase
      - Keep functions focused and testable

      IMPORTANT: Before implementing anything, check if production code
      already exists. Do NOT rewrite working implementations. Only make
      targeted changes to fix specific failures or address directed
      feedback from reviewers/validators.
    prompt: |
      Implement or verify code for **{{ workflow.input.phase }}**.

      **Phase:** {{ workflow.input.phase }}
      **Specification:** `{{ workflow.input.spec_path }}`
      **Design:** `{{ designer.output.design_path }}`

      **Test files that must pass:**
      {% for tf in unit_test_writer.output.test_files_created %}
      - `{{ tf }}`
      {% endfor %}

      {% if unit_test_validator is defined and unit_test_validator.output and not unit_test_validator.output.all_pass %}
      **Previous attempt had failing tests — fix ONLY these:**
      {{ unit_test_validator.output.failure_details }}

      Address ONLY the specific failures listed above. Do NOT rewrite
      unrelated code that is already working.
      {% endif %}

      {% if qa_validator is defined and qa_validator.output and not qa_validator.output.approved %}
      **QA validator found gaps — address ONLY these:**
      {% for gap in qa_validator.output.gaps %}
      - {{ gap }}
      {% endfor %}
      {{ qa_validator.output.feedback }}

      Address ONLY the specific gaps listed above. Do NOT rewrite
      unrelated code that is already passing QA checks.
      {% endif %}

      ## Tasks

      1. **Check existing state first:**
         - Run `go build ./...` — does the code already compile?
         - Run `go test ./... -count=1` — which tests already pass?
         - If all tests pass and there is no directed feedback to address,
           report success and proceed without changes.

      2. **If implementation is needed** (tests fail or gaps exist):
         - Only create files that don't already exist:
         {% for f in designer.output.files_to_create %}
            - `{{ f }}`
         {% endfor %}
         - Only modify files where changes are needed:
         {% for f in designer.output.files_to_modify %}
            - `{{ f }}`
         {% endfor %}

      3. **Run `go build ./...`** — Ensure compilation succeeds
      4. **Run `go test ./... -count=1`** — Verify tests pass
      5. **Run `go vet ./...`** — No warnings

      **CRITICAL:** Do NOT rewrite existing working code. Make minimal,
      targeted changes. If all tests pass and no feedback needs addressing,
      simply report the current passing state.
    output:
      files_created:
        type: array
        description: Files created during implementation
      files_modified:
        type: array
        description: Files modified during implementation
      build_success:
        type: boolean
        description: Whether go build succeeds
      implementation_notes:
        type: string
        description: Notes about decisions made during implementation
    routes:
      - to: unit_test_validator

  # ─── 5. UNIT TEST VALIDATOR AGENT ────────────────────────────
  - name: unit_test_validator
    description: >-
      Runs the full test suite and validates that ALL unit tests
      from the spec acceptance criteria now pass.
    model: gpt-5.4
    input:
      - workflow.input.phase
      - unit_test_writer.output
      - coder.output
    system_prompt: |
      You are a Test Validation agent. Your ONLY job is to run tests,
      analyze results, and report pass/fail status. You do NOT write
      code or fix issues — you only validate.
    prompt: |
      Validate that all unit tests pass after implementation.

      **Test files:**
      {% for tf in unit_test_writer.output.test_files_created %}
      - `{{ tf }}`
      {% endfor %}

      ## Tasks

      1. Run `go test ./... -v -count=1` to execute all tests
      2. Parse the output to identify:
         - Total tests run
         - Tests that PASS
         - Tests that FAIL (with failure messages)
      3. Run `go vet ./...` to check for issues
      4. Report results

      Set `all_pass` to true ONLY if every test passes AND go vet is clean.
    output:
      all_pass:
        type: boolean
        description: Whether ALL tests pass
      total_tests:
        type: number
        description: Total number of tests run
      passed_tests:
        type: number
        description: Number of passing tests
      failed_tests:
        type: number
        description: Number of failing tests
      failure_details:
        type: string
        description: Details of any test failures
      vet_clean:
        type: boolean
        description: Whether go vet passes cleanly
    routes:
      - to: code_reviewer
        when: "{{ output.all_pass }}"
      - to: coder
        when: "{{ not output.all_pass }}"

  # ─── 5b. CODE REVIEW AGENT ───────────────────────────────────
  - name: code_reviewer
    description: >-
      Performs an experienced code review of the implementation,
      checking logic, patterns, performance, and maintainability.
      Returns to coder if issues are found.
    model: gpt-5.4
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - coder.output
      - unit_test_validator.output
    system_prompt: |
      You are a Principal Engineer performing a thorough code review.
      You focus on substantive issues — logic bugs, incorrect assumptions,
      performance pitfalls, security concerns, and maintainability problems.

      You do NOT comment on:
      - Formatting or style (that's what linters are for)
      - Trivial naming preferences
      - Issues already caught by tests or go vet

      Project conventions you enforce:
      - All logging via go.uber.org/zap (no fmt.Printf, no bare log)
      - controller-runtime code uses logr.Logger backed by zapr
      - Azure clients use *zap.Logger directly
      - Errors wrapped with fmt.Errorf("context: %w", err)
      - Functions should be focused and testable
      - Follow existing codebase patterns
    prompt: |
      Review the implementation for **{{ workflow.input.phase }}**.

      **Design:** Read `{{ designer.output.design_path }}`
      **Specification:** `{{ workflow.input.spec_path }}`

      **Files created:**
      {% for f in coder.output.files_created %}
      - `{{ f }}`
      {% endfor %}

      **Files modified:**
      {% for f in coder.output.files_modified %}
      - `{{ f }}`
      {% endfor %}

      **Unit tests:** {{ unit_test_validator.output.passed_tests }}/{{ unit_test_validator.output.total_tests }} passing

      **Implementation notes:** {{ coder.output.implementation_notes }}

      ## Review Focus Areas

      1. **Logic Correctness** — Does the code correctly implement the spec?
         - Are there off-by-one errors, nil pointer risks, or race conditions?
         - Are map/slice operations safe for concurrent access?
         - Are Kubernetes controller reconciliation loops idempotent?

      2. **Error Handling** — Is every error path handled properly?
         - Are errors wrapped with context using %w?
         - Are transient vs. permanent errors distinguished?
         - Do controllers return appropriate requeue decisions?

      3. **Performance** — Are there unnecessary allocations or API calls?
         - Are Azure API calls minimized (batching, caching)?
         - Are list/watch patterns efficient?

      4. **Security** — Are credentials handled safely?
         - No secrets logged, no hardcoded values
         - Azure credentials use managed identity / DefaultAzureCredential

      5. **Maintainability** — Is the code easy to understand and extend?
         - Are interfaces well-defined for testability?
         - Is the code consistent with existing patterns?

      Read each file that was created or modified and provide your review.

      Set `approved` to true ONLY if there are no logic issues that could
      cause incorrect behavior. Minor suggestions are fine to note but
      should not block approval.
    output:
      approved:
        type: boolean
        description: Whether the code passes review (no logic issues)
      critical_issues:
        type: array
        description: Logic bugs or correctness issues that must be fixed
      suggestions:
        type: array
        description: Non-blocking improvement suggestions
      feedback:
        type: string
        description: Detailed review feedback for the coder
      review_summary:
        type: string
        description: One-paragraph summary of the review
    routes:
      - to: unit_test_writer_v2
        when: "{{ output.approved }}"
      - to: coder
        when: "{{ not output.approved }}"

  # ═══════════════════════════════════════════════════════════════
  # ITERATION 2: Swapped models for independent validation
  # Original: Writer(Opus) Coder(Opus) Validator(GPT) Reviewer(GPT)
  # Swapped:  Writer(GPT)  Coder(GPT)  Validator(Opus) Reviewer(Opus)
  # ═══════════════════════════════════════════════════════════════

  # ─── 5c. UNIT TEST WRITER v2 (Swapped: GPT) ──────────────────
  - name: unit_test_writer_v2
    description: >-
      Second pass: Reviews existing tests and adds only missing edge
      cases or acceptance criteria coverage based on code review feedback.
    model: gpt-5.4
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - unit_test_writer.output
      - coder.output
      - code_reviewer.output
    system_prompt: |
      You are a Test Engineer using a different perspective to strengthen
      existing tests. You review the current test suite and add ONLY
      missing edge cases or acceptance criteria. You do NOT rewrite
      existing tests.

      Testing conventions for this project:
      - Use standard `testing` package with `t.Run()` subtests
      - Use `zaptest.NewLogger(t)` for test loggers
      - Use table-driven tests where appropriate
      - Assert with `if got != want { t.Errorf(...) }` pattern

      IMPORTANT: Check what tests already exist before adding any.
      Only add tests that address specific gaps identified by the
      code reviewer or missing acceptance criteria.
    prompt: |
      Review and strengthen the test suite for **{{ workflow.input.phase }}**.

      **Specification:** Read `{{ workflow.input.spec_path }}`
      **Design:** Read `{{ designer.output.design_path }}`

      **Existing test files from iteration 1:**
      {% for tf in unit_test_writer.output.test_files_created %}
      - `{{ tf }}`
      {% endfor %}

      **Code review feedback from iteration 1:**
      {{ code_reviewer.output.review_summary }}

      {% if code_reviewer.output.critical_issues %}
      **Critical issues that may need test coverage:**
      {% for i in code_reviewer.output.critical_issues %}
      - {{ i }}
      {% endfor %}
      {% endif %}

      {% if code_reviewer.output.suggestions %}
      **Suggestions that may need test coverage:**
      {% for s in code_reviewer.output.suggestions %}
      - {{ s }}
      {% endfor %}
      {% endif %}

      ## Tasks

      1. **Run `go test ./... -v -count=1`** to see current test state
      2. **Inventory existing tests** vs. required acceptance criteria
      3. **Identify gaps** — ONLY tests that are:
         - Required by the spec but missing
         - Addressing specific code reviewer critical issues
         - Covering edge cases the reviewer flagged
      4. **Add ONLY the missing tests** — do NOT modify or rewrite
         passing tests
      5. **Run `go test ./... -v -count=1`** to confirm all pass

      If the test suite is already comprehensive and covers all reviewer
      feedback, report that and proceed WITHOUT changes.
    output:
      test_files_updated:
        type: array
        description: Test files created or updated in this pass
      new_tests_added:
        type: number
        description: Number of new test functions added
      gaps_found:
        type: array
        description: Test gaps that were identified and filled
      all_tests_pass:
        type: boolean
        description: Whether all tests (old + new) pass
    routes:
      - to: coder_v2

  # ─── 5d. CODER v2 (Swapped: GPT) ─────────────────────────────
  - name: coder_v2
    description: >-
      Second pass: Fixes only specific issues surfaced by new tests
      or code review critical issues. Does not rewrite working code.
    model: gpt-5.4
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - coder.output
      - code_reviewer.output
      - unit_test_writer_v2.output
      - unit_test_validator_v2.output?
    system_prompt: |
      You are a Senior Go Engineer performing a targeted second pass.
      You fix ONLY specific issues identified by code review or failing
      tests. You do NOT rewrite working code.

      Coding standards:
      - All logging via go.uber.org/zap
      - controller-runtime code uses logr.Logger backed by zapr
      - Errors wrapped with fmt.Errorf("context: %w", err)
      - Follow existing codebase patterns

      IMPORTANT: Make minimal, surgical changes. If all tests pass and
      no critical issues need addressing, report success without changes.
    prompt: |
      Targeted fixes for **{{ workflow.input.phase }}** (iteration 2).

      **Design:** `{{ designer.output.design_path }}`

      {% if code_reviewer.output.critical_issues %}
      **Critical issues to fix (from code review):**
      {% for i in code_reviewer.output.critical_issues %}
      - {{ i }}
      {% endfor %}
      {% endif %}

      **Code review suggestions (address only where they fix correctness):**
      {% for s in code_reviewer.output.suggestions %}
      - {{ s }}
      {% endfor %}

      **New tests added in iteration 2:**
      {% for tf in unit_test_writer_v2.output.test_files_updated %}
      - `{{ tf }}`
      {% endfor %}

      {% if unit_test_validator_v2 is defined and unit_test_validator_v2.output and not unit_test_validator_v2.output.all_pass %}
      **Failing tests to fix:**
      {{ unit_test_validator_v2.output.failure_details }}

      Address ONLY these specific failures. Do NOT rewrite unrelated code.
      {% endif %}

      ## Tasks

      1. **Run `go test ./... -count=1`** — check current state
      2. **If all tests pass and no critical issues remain:**
         - Report success, no changes needed
      3. **If there are failures or critical issues:**
         - Fix ONLY the specific failures or critical issues
         - Do NOT refactor working code
      4. **Run `go build ./...`** and **`go test ./... -v -count=1`**
      5. **Run `go vet ./...`**

      **CRITICAL:** Do NOT break existing passing tests. Make minimal
      changes. If nothing needs fixing, proceed without modifications.
    output:
      files_modified:
        type: array
        description: Files modified in this pass
      changes_made:
        type: array
        description: Specific changes made
      build_success:
        type: boolean
        description: Whether go build succeeds
      implementation_notes:
        type: string
        description: Notes about changes in this pass
    routes:
      - to: unit_test_validator_v2

  # ─── 5e. UNIT TEST VALIDATOR v2 (Swapped: Opus) ──────────────
  - name: unit_test_validator_v2
    description: >-
      Second pass: Opus validates that ALL tests (original + new) pass.
    model: claude-opus-4.6
    input:
      - workflow.input.phase
      - unit_test_writer.output
      - unit_test_writer_v2.output
      - coder_v2.output
    system_prompt: |
      You are a Test Validation agent. Your ONLY job is to run tests,
      analyze results, and report pass/fail status. You do NOT write
      code or fix issues — you only validate.
    prompt: |
      Validate that ALL tests pass after the second implementation pass.

      **Original test files:**
      {% for tf in unit_test_writer.output.test_files_created %}
      - `{{ tf }}`
      {% endfor %}

      **New/updated test files from iteration 2:**
      {% for tf in unit_test_writer_v2.output.test_files_updated %}
      - `{{ tf }}`
      {% endfor %}

      ## Tasks

      1. Run `go test ./... -v -count=1` to execute ALL tests
      2. Parse the output — identify pass/fail for every test
      3. Run `go vet ./...`
      4. Report results

      Set `all_pass` to true ONLY if every test passes AND go vet is clean.
    output:
      all_pass:
        type: boolean
        description: Whether ALL tests pass
      total_tests:
        type: number
        description: Total number of tests run
      passed_tests:
        type: number
        description: Number of passing tests
      failed_tests:
        type: number
        description: Number of failing tests
      failure_details:
        type: string
        description: Details of any test failures
      vet_clean:
        type: boolean
        description: Whether go vet passes cleanly
    routes:
      - to: code_reviewer_v2
        when: "{{ output.all_pass }}"
      - to: coder_v2
        when: "{{ not output.all_pass }}"

  # ─── 5f. CODE REVIEWER v2 (Swapped: Opus) ────────────────────
  - name: code_reviewer_v2
    description: >-
      Second pass: Opus reviews the final implementation for any
      remaining logic issues before the human gate.
    model: claude-opus-4.6
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - coder.output
      - coder_v2.output
      - unit_test_validator_v2.output
      - code_reviewer.output
    system_prompt: |
      You are a Principal Engineer performing a final code review.
      This is the SECOND review pass using a different model than the
      first reviewer. Focus on anything the first review may have missed.

      You focus on substantive issues — logic bugs, incorrect assumptions,
      performance pitfalls, security concerns, and maintainability.

      Project conventions:
      - All logging via go.uber.org/zap
      - controller-runtime code uses logr.Logger backed by zapr
      - Errors wrapped with fmt.Errorf("context: %w", err)
    prompt: |
      Final code review for **{{ workflow.input.phase }}** (iteration 2).

      **Design:** `{{ designer.output.design_path }}`
      **Specification:** `{{ workflow.input.spec_path }}`

      **First review summary:** {{ code_reviewer.output.review_summary }}

      **Changes in iteration 2:**
      {% for c in coder_v2.output.changes_made %}
      - {{ c }}
      {% endfor %}

      **Files modified in iteration 2:**
      {% for f in coder_v2.output.files_modified %}
      - `{{ f }}`
      {% endfor %}

      **All tests:** {{ unit_test_validator_v2.output.passed_tests }}/{{ unit_test_validator_v2.output.total_tests }} passing

      ## Review Focus

      1. **Were first-review suggestions addressed properly?**
      2. **Any new issues introduced in iteration 2?**
      3. **Final logic correctness check** — ready for integration?

      Approve if the implementation is solid. Only block for genuine
      logic issues that would cause incorrect behavior.
    output:
      approved:
        type: boolean
        description: Whether the code passes final review
      critical_issues:
        type: array
        description: Any remaining logic issues
      feedback:
        type: string
        description: Final review feedback
      review_summary:
        type: string
        description: One-paragraph summary
    routes:
      - to: implementation_review_gate
        when: "{{ output.approved }}"
      - to: coder_v2
        when: "{{ not output.approved }}"

  # ─── 5g. HUMAN GATE: Implementation Review ───────────────────
  - name: implementation_review_gate
    type: human_gate
    description: >-
      Human reviews the completed implementation, passing unit tests,
      and code review results before integration testing begins.
    prompt: |
      ## Implementation Complete — Code Reviewed & Unit Tests Passing

      **Phase:** {{ workflow.input.phase }}

      ### Iteration 1 (Opus coder / GPT reviewer)
      **Tests:** {{ unit_test_validator.output.passed_tests }}/{{ unit_test_validator.output.total_tests }} passing
      **Review:** {{ code_reviewer.output.review_summary }}

      ### Iteration 2 (GPT coder / Opus reviewer)
      **Tests:** {{ unit_test_validator_v2.output.passed_tests }}/{{ unit_test_validator_v2.output.total_tests }} passing
      **Review:** {{ code_reviewer_v2.output.review_summary }}

      {% if code_reviewer_v2.output.critical_issues %}
      **Remaining issues (iteration 2):**
      {% for i in code_reviewer_v2.output.critical_issues %}
      - {{ i }}
      {% endfor %}
      {% endif %}

      **Files created:**
      {% for f in coder.output.files_created %}
      - `{{ f }}`
      {% endfor %}

      **Files modified:**
      {% for f in coder.output.files_modified %}
      - `{{ f }}`
      {% endfor %}

      **Implementation notes:** {{ coder.output.implementation_notes }}
    options:
      - label: Approve — proceed to integration tests
        value: proceed
        route: integration_tester
      - label: Send back to coder for changes
        value: revise
        route: coder
        prompt_for: feedback
      - label: Abort workflow
        value: abort
        route: $end

  # ─── 6. INTEGRATION TEST AGENT ───────────────────────────────
  - name: integration_tester
    description: >-
      Writes and runs integration tests that validate the phase's
      components work together with adjacent modules.
    model: claude-opus-4.6
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - coder.output
      - unit_test_validator.output
    system_prompt: |
      You are an Integration Test Engineer. You write tests that verify
      components work together across module boundaries.

      For Kubernetes controllers, you use:
      - envtest for CRD + controller integration tests
      - Fake Azure clients (internal/azure/fake/) for ARM interactions
      - zaptest.NewLogger(t) for test logging

      Integration tests go in `test/integration/` or alongside the code
      with `_integration_test.go` suffix.
    prompt: |
      Write and run integration tests for **{{ workflow.input.phase }}**.

      **Specification:** `{{ workflow.input.spec_path }}`
      **Design:** `{{ designer.output.design_path }}`

      **Files implemented:**
      {% for f in coder.output.files_created %}
      - `{{ f }}`
      {% endfor %}

      **Unit test results:** {{ unit_test_validator.output.passed_tests }}/{{ unit_test_validator.output.total_tests }} passing

      ## Tasks

      1. **Identify cross-module integration points** for this phase
      2. **Write integration tests** that verify:
         - Components from this phase work with existing code
         - Data flows correctly between modules
         - Error propagation works across boundaries
      3. **Run integration tests** and report results
      4. If no meaningful integration points exist for this phase
         (e.g., Phase 2 is pure functions), report that and move on

      Save integration tests to appropriate locations.
    output:
      integration_test_files:
        type: array
        description: Integration test files created
      integration_tests_pass:
        type: boolean
        description: Whether all integration tests pass
      integration_notes:
        type: string
        description: Notes about integration test coverage
    routes:
      - to: qa_review_gate

  # ─── 6b. HUMAN GATE: Pre-QA Review ───────────────────────────
  - name: qa_review_gate
    type: human_gate
    description: >-
      Human reviews the integration test results and QA validation
      checklist before the QA validator runs its automated checks.
    prompt: |
      ## Pre-QA Review — Inspect Before Final Validation

      **Phase:** {{ workflow.input.phase }}

      **Unit Tests:** {{ unit_test_validator.output.passed_tests }}/{{ unit_test_validator.output.total_tests }} passing

      **Integration Tests Pass:** {{ integration_tester.output.integration_tests_pass }}
      **Integration Notes:** {{ integration_tester.output.integration_notes }}

      **Integration Test Files:**
      {% for f in integration_tester.output.integration_test_files %}
      - `{{ f }}`
      {% endfor %}

      ### QA Validator Will Check:
      1. Every deliverable file exists and is fully implemented
      2. Every TDD acceptance test (T*.x) passes
      3. `go build`, `go test`, `go vet` all clean
      4. zap logging used throughout (no fmt.Printf)
      5. Error wrapping with %w
      6. Score ≥ 90 to approve the phase
    options:
      - label: Proceed to QA validation
        value: proceed
        route: qa_validator
      - label: Send back to coder for fixes
        value: revise
        route: coder
        prompt_for: feedback
      - label: Abort workflow
        value: abort
        route: $end

  # ─── 7. QA VALIDATOR AGENT ───────────────────────────────────
  - name: qa_validator
    description: >-
      Final QA gate that validates the implementation against the
      spec's acceptance criteria, checking completeness and correctness.
    model: gpt-5.4
    input:
      - workflow.input.phase
      - workflow.input.spec_path
      - designer.output
      - coder.output
      - unit_test_validator.output
      - integration_tester.output
    system_prompt: |
      You are a QA Validation agent. You perform the final quality gate
      by verifying the implementation against the specification.

      You are thorough, systematic, and uncompromising about spec compliance.
      You check every deliverable, every acceptance test, and every edge case.
    prompt: |
      Perform final QA validation for **{{ workflow.input.phase }}**.

      **Specification:** Read `{{ workflow.input.spec_path }}` — the target phase section.

      **Design:** `{{ designer.output.design_path }}`

      ## Validation Checklist

      1. **Deliverables Audit** — Check EVERY deliverable in the spec's phase table:
         - Does the file exist at the specified path?
         - Does it contain the expected types/functions?
         - Is the implementation complete (not stubbed)?

      2. **TDD Acceptance Tests Audit** — For EVERY test ID (T1.1, T1.2, etc.):
         - Does a corresponding test function exist?
         - Does the test assert the correct behavior?
         - Does the test PASS?

      3. **Code Quality Check**:
         - Run `go build ./...` — must succeed
         - Run `go test ./... -count=1` — all must pass
         - Run `go vet ./...` — must be clean
         - Verify zap logging is used (no fmt.Printf, no bare logr)
         - Verify error wrapping with %w

      4. **Spec Compliance Score** — Rate 0-100:
         | Criteria | Weight |
         |----------|--------|
         | All deliverables present | 30% |
         | All acceptance tests pass | 30% |
         | Code quality (build, vet, conventions) | 20% |
         | Integration test coverage | 20% |

      Approve if score >= 90. Otherwise, list specific gaps.
    output:
      score:
        type: number
        description: QA score 0-100
      approved:
        type: boolean
        description: Whether the phase passes QA (score >= 90)
      deliverables_complete:
        type: boolean
        description: Whether all spec deliverables are present
      acceptance_tests_pass:
        type: boolean
        description: Whether all TDD acceptance tests pass
      gaps:
        type: array
        description: List of specific gaps or issues found
      feedback:
        type: string
        description: Detailed QA feedback
    routes:
      - to: $end
        when: "{{ output.approved }}"
      - to: coder
        when: "{{ not output.approved }}"

# ═══════════════════════════════════════════════════════════════════
# WORKFLOW OUTPUT
# ═══════════════════════════════════════════════════════════════════

output:
  phase: "{{ workflow.input.phase }}"
  design_path: "{{ designer.output.design_path }}"
  design_review_score: "{{ design_reviewer.output.score }}"
  unit_tests_total: "{{ unit_test_validator.output.total_tests }}"
  unit_tests_passed: "{{ unit_test_validator.output.passed_tests }}"
  integration_tests_pass: "{{ integration_tester.output.integration_tests_pass }}"
  qa_score: "{{ qa_validator.output.score }}"
  qa_approved: "{{ qa_validator.output.approved }}"
  files_created: "{{ coder.output.files_created }}"
  iterations: "{{ context.iteration }}"
