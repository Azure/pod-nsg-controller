name: Create Release Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release version in vMAJOR.MINOR.PATCH format
        required: true
        type: string
      target_sha:
        description: Full 40-character commit SHA to tag
        required: true
        type: string
      reason:
        description: Reason for the release
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.validate.outputs.tag_name }}
      target_sha: ${{ steps.validate.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: validate
        name: Validate release request
        env:
          TAG_NAME: ${{ inputs.tag_name }}
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::tag_name must use vMAJOR.MINOR.PATCH"
            exit 1
          }
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::target_sha must be a full commit SHA"
            exit 1
          }
git rev-parse "${TARGET_SHA}^{commit}" >/dev/null
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "::error::target_sha must be an ancestor of main"
            exit 1
          }
          if git ls-remote --exit-code --tags --refs origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::tag already exists: ${TAG_NAME}"
            exit 1
          fi
          echo "tag_name=${TAG_NAME}" >>"$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse "${TARGET_SHA}^{commit}")" >>"$GITHUB_OUTPUT"

  create:
    needs: validate
    runs-on: ubuntu-latest
    environment: container-networking-tag-approval
    permissions:
      contents: write
      deployments: write
    concurrency:
      group: release-tag-${{ needs.validate.outputs.tag_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.validate.outputs.tag_name }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags --refs origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "tag already exists: ${TAG_NAME}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$TARGET_SHA" -m "$(cat <<EOF
          ${TAG_NAME}

          Target SHA: ${TARGET_SHA}
          Requested By: ${GITHUB_ACTOR}
          Reason: ${REASON}
          Workflow Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG_NAME}"
