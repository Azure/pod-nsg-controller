# =============================================================================
# E2E Validation & Release pipeline.
#
# EPIC-001 foundation: this file currently implements only the deterministic
# `meta` job (run metadata + topology-aware name maps + run-manifest foundation)
# and a `naming-tests` job that exercises the naming/lib/meta/build helpers.
#
# EPIC-002 adds the `build` job: it builds the candidate controller image once
# (reusing `make docker-build`), publishes it to the staging ACR BY DIGEST via
# OIDC (skipped on PRs), generates an SBOM (syft), and records the immutable
# digest/reference into the run manifest for downstream jobs (build-once,
# promote-by-digest). The trigger matrix, GitHub Environments, concurrency
# policy, and the provision / deploy / validate / diagnostics / cleanup /
# release jobs are added by later epics (see docs/projects/...).
#
# EPIC-003 adds the per-region `provision` job (self-managed clusters, shared
# ASGs, explicit-subscription) and the same-subscription `rbac` job.
#
# EPIC-004 adds the `deploy` (per-region) and `validate_multicluster` jobs:
# `deploy` applies CRD + RBAC + manager@digest with a short-lived, repo-scoped
# ACR imagePullSecret plus the documented PodASGMappings/workloads and baseline;
# `validate_multicluster` runs Tests 1-4 from docs/multi-cluster-test-setup.md
# and publishes machine-readable per-test results into the run manifest. Because
# the runner has NO path to the self-managed API server, all kubectl runs ON the
# control-plane node via `az vm run-command` (scripts/e2e/lib.sh azrun::*); ASG
# membership is verified from the runner with `az rest`. The remaining
# diagnostics / cleanup / release jobs are added by later epics.
#
# EPIC-009 adds the `build_cni` and `validate_tt` jobs: `build_cni` builds the
# transparent-tunnel CNI artifact once via `make cni-artifact` and publishes it
# by digest; `validate_tt` (after validate_multicluster, RD-017) installs it on
# the centraluseuap workers (control-plane excluded), provisions NSG rules
# 190/200 + PodASGMappings, runs TTS-001..TTS-007, and always collects CNI
# diagnostics. The controller+CNI digests form one atomic artifact set gated on
# validate_tt by scripts/e2e/promote-release.sh (release job lands in EPIC-006).
#
# Traceability: ITEM-001..ITEM-014, FR-001..FR-005, FR-011, FR-012, FR-015,
# FR-016, FR-028, ITEM-028..ITEM-035, FR-018..FR-024, TTS-001..TTS-007,
# NFR-003, NFR-006, NFR-007, NFR-010, NFR-011, SEC-001, SEC-003, SEC-004,
# SEC-006, RD-004, RD-013..RD-017, RD-020, CON-003, CON-010, CON-011,
# PRD 3.1/3.3/3.4/3.5/3.6/9.1.
# =============================================================================
name: E2E Validation & Release

on:
  workflow_dispatch:
    inputs:
      validation_topologies:
        description: "Topologies to validate: comma-separated ss and/or xs. A release forces ss,xs."
        type: string
        default: "ss,xs"
      regions:
        description: "Canary regions (comma-separated): eastus2euap and/or centraluseuap."
        type: string
        default: "eastus2euap,centraluseuap"
      release:
        description: "Promote the validated artifact set to the public ACR (requires ss,xs)."
        type: boolean
        default: false
      release_version:
        description: "Semantic version to release, e.g. v1.2.3 (required when release=true)."
        type: string
        default: ""
      primary_subscription_id:
        description: "Primary subscription (Cluster A + shared ASGs). Non-sensitive identifier."
        type: string
        default: ""
      secondary_subscription_id:
        description: "Secondary subscription (Cluster B, xs only). MUST differ from primary."
        type: string
        default: ""
  pull_request:
    branches: [main]
    paths:
      - "scripts/e2e/**"
      - ".github/workflows/e2e-validation-release.yml"

permissions:
  contents: read

jobs:
  meta:
    name: Compute run metadata & names
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      date_utc: ${{ steps.meta.outputs.date_utc }}
      run_suffix: ${{ steps.meta.outputs.run_suffix }}
      git_sha: ${{ steps.meta.outputs.git_sha }}
      validation_topologies: ${{ steps.meta.outputs.validation_topologies }}
      regions: ${{ steps.meta.outputs.regions }}
      regions_json: ${{ steps.meta.outputs.regions_json }}
      release_requested: ${{ steps.meta.outputs.release_requested }}
      release_version: ${{ steps.meta.outputs.release_version }}
      controller_staging_repo: ${{ steps.meta.outputs.controller_staging_repo }}
      controller_staging_tag: ${{ steps.meta.outputs.controller_staging_tag }}
      cni_staging_repo: ${{ steps.meta.outputs.cni_staging_repo }}
      cni_staging_tag: ${{ steps.meta.outputs.cni_staging_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute run metadata, names, and run-manifest foundation
        id: meta
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TOPOLOGIES: ${{ inputs.validation_topologies || 'ss,xs' }}
          INPUT_REGIONS: ${{ inputs.regions || 'eastus2euap,centraluseuap' }}
          INPUT_RELEASE: ${{ inputs.release || false }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version || '' }}
          PRIMARY_SUBSCRIPTION_ID: ${{ inputs.primary_subscription_id || '' }}
          SECONDARY_SUBSCRIPTION_ID: ${{ inputs.secondary_subscription_id || '' }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/meta.sh

      - name: Upload run-manifest foundation
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest
          path: run-manifest.json
          retention-days: 30

  build:
    name: Build & publish candidate (by digest)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cloud publish uses GitHub OIDC only (no standing secrets, NFR-005/SEC-001).
    # PRs build to validate the Dockerfile but never authenticate or push
    # (RD-009). GitHub Environment approval for the cloud path is added in
    # EPIC-007 (FR-013) together with the trigger matrix and concurrency policy.
    permissions:
      contents: read
      id-token: write
    outputs:
      image_reference: ${{ steps.build.outputs.image_reference }}
      image_digest: ${{ steps.build.outputs.image_digest }}
      image_repo: ${{ steps.build.outputs.image_repo }}
      image_tag: ${{ steps.build.outputs.image_tag }}
      image_registry: ${{ steps.build.outputs.image_registry }}
      pushed: ${{ steps.build.outputs.pushed }}
      sbom_path: ${{ steps.build.outputs.sbom_path }}
    steps:
      - uses: actions/checkout@v4

      # Start from the meta job's run-manifest so the recorded controller digest
      # is threaded through the single run manifest (ITEM-006 / NFR-006).
      - name: Download run-manifest foundation
        uses: actions/download-artifact@v4
        with:
          name: run-manifest
          path: .

      # syft provides the SBOM generator on PATH for both PR and cloud runs.
      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0.17.9

      # OIDC login only for cloud-publishing runs (skipped on PRs). Mirrors the
      # existing phase9-integration-e2e.yml pattern (SEC-001).
      - name: Azure Login (OIDC)
        if: ${{ github.event_name != 'pull_request' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build candidate, publish by digest, generate SBOM
        id: build
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGING_ACR: ${{ vars.E2E_STAGING_ACR }}
          CONTROLLER_STAGING_REPO: ${{ needs.meta.outputs.controller_staging_repo }}
          CONTROLLER_STAGING_TAG: ${{ needs.meta.outputs.controller_staging_tag }}
          MANIFEST_PATH: run-manifest.json
          SBOM_PATH: sbom/controller.spdx.json
        run: bash scripts/e2e/build.sh

      - name: Upload controller SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-controller
          path: sbom/controller.spdx.json
          retention-days: 30

      - name: Upload run-manifest (with candidate digest)
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-build
          path: run-manifest.json
          retention-days: 30

  # ===========================================================================
  # EPIC-009 - Transparent-tunnel CNI artifact build/publish (ITEM-028/029).
  #
  # Builds/packages the transparent-tunnel CNI artifact ONCE via the repo-native
  # `make cni-artifact` target (wrapping scripts/e2e/build-cni.sh, FR-018): it
  # acquires the azure-vnet binary + azure-linux-transparent-tunnel.conflist from
  # a PINNED azure-container-networking source (CON-011/RD-015), verifies a
  # recorded checksum, asserts the conflist declares "mode": "transparent-tunnel",
  # packages a digest-addressable OCI artifact, pushes it BY DIGEST to the staging
  # ACR via OIDC (skipped on PRs, RD-009), generates an SBOM, and records the CNI
  # digest into the run manifest. The exact pin (ref / prebuilt URL+checksum) is
  # provided by EPIC-008 environment vars (ASSUMPTION-005); build-cni.sh carries
  # the defaults. Runs in parallel with `build`; both digests form the atomic
  # artifact set consumed by validate_tt and release (NFR-011).
  build_cni:
    name: Build & publish CNI artifact (by digest)
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      cni_reference: ${{ steps.build_cni.outputs.cni_reference }}
      cni_digest: ${{ steps.build_cni.outputs.cni_digest }}
      cni_repo: ${{ steps.build_cni.outputs.cni_repo }}
      cni_tag: ${{ steps.build_cni.outputs.cni_tag }}
      cni_registry: ${{ steps.build_cni.outputs.cni_registry }}
      pushed: ${{ steps.build_cni.outputs.pushed }}
      sbom_path: ${{ steps.build_cni.outputs.sbom_path }}
    steps:
      - uses: actions/checkout@v4

      # Thread the CNI digest through the single run manifest started by `meta`.
      - name: Download run-manifest foundation
        uses: actions/download-artifact@v4
        with:
          name: run-manifest
          path: .

      # Go toolchain for the primary source-build mode (GUD-001); oras packages
      # the OCI artifact by digest; syft generates the SBOM.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install oras (OCI artifact push/copy by digest)
        uses: oras-project/setup-oras@v1

      - name: Install syft (SBOM)
        uses: anchore/sbom-action/download-syft@v0.17.9

      # OIDC login only for cloud-publishing runs (skipped on PRs, SEC-001).
      - name: Azure Login (OIDC)
        if: ${{ github.event_name != 'pull_request' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Repo-native build/package/push by digest (make target wraps build-cni.sh).
      # The CNI source pin is EPIC-008 configuration surfaced as environment vars;
      # build-cni.sh supplies defaults when a var is unset (ASSUMPTION-005).
      - name: Build CNI artifact, publish by digest, generate SBOM
        id: build_cni
        env:
          EVENT_NAME: ${{ github.event_name }}
          STAGING_ACR: ${{ vars.E2E_STAGING_ACR }}
          CNI_STAGING_REPO: ${{ needs.meta.outputs.cni_staging_repo }}
          CNI_STAGING_TAG: ${{ needs.meta.outputs.cni_staging_tag }}
          CNI_SOURCE_MODE: ${{ vars.E2E_CNI_SOURCE_MODE }}
          CNI_SOURCE_REPO: ${{ vars.E2E_CNI_SOURCE_REPO }}
          CNI_SOURCE_REF: ${{ vars.E2E_CNI_SOURCE_REF }}
          CNI_BINARY_URL: ${{ vars.E2E_CNI_BINARY_URL }}
          CNI_CONFLIST_URL: ${{ vars.E2E_CNI_CONFLIST_URL }}
          CNI_BINARY_SHA256: ${{ vars.E2E_CNI_BINARY_SHA256 }}
          MANIFEST_PATH: run-manifest.json
          SBOM_PATH: sbom/cni.spdx.json
        run: make cni-artifact

      - name: Upload CNI SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cni
          path: sbom/cni.spdx.json
          retention-days: 30

      - name: Upload run-manifest (with candidate CNI digest)
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-build-cni
          path: run-manifest.json
          retention-days: 30

  # ===========================================================================
  # EPIC-003 - Provisioning generalization (ITEM-007/008/010).
  #
  # Per-region matrix that provisions the same-subscription (`ss`) topology with
  # explicit subscription context on every Azure call (RD-020). Region input is
  # re-validated (canary-only, CON-001) and a VM-quota preflight GATES
  # provisioning (RISK-003) before any resource is created. Cloud steps are
  # skipped on pull_request (RD-009: no fork OIDC / no per-PR cost). GitHub
  # Environment approval and the non-cancelable cloud concurrency group are
  # added in EPIC-007 (FR-013/RD-008); `xs` provisioning is EPIC-010.
  provision:
    name: Provision ss / ${{ matrix.region }}
    needs: meta
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.meta.outputs.regions_json) }}
    env:
      TOPOLOGY: ss
      REGION: ${{ matrix.region }}
      PRIMARY_SUBSCRIPTION_ID: ${{ inputs.primary_subscription_id || vars.E2E_PRIMARY_SUBSCRIPTION_ID }}
      VM_QUOTA_FAMILY: standardDSv5Family
      VM_QUOTA_REQUIRED: "16"
    steps:
      - uses: actions/checkout@v4

      # Defensive canary-only re-validation (meta already rejects non-canary
      # regions in `run`, but the provision job fails fast too, ITEM-010/CON-001).
      - name: Validate region (canary-only)
        run: |
          source scripts/e2e/lib.sh
          # shellcheck disable=SC2153  # REGION comes from the job env (matrix.region)
          lib::validate_canary_region "${REGION}" >/dev/null

      # Start from the meta foundation (names tree) and augment it with this
      # region's provision entry; the per-region manifests are merged in the
      # summary job (EPIC-007).
      - name: Download run-manifest foundation
        uses: actions/download-artifact@v4
        with:
          name: run-manifest
          path: .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.PRIMARY_SUBSCRIPTION_ID }}

      # VM quota preflight GATES provisioning: 1 control-plane + 3 workers of the
      # smallest viable SKU (Standard_D4s_v5 = 4 vCPU) = 16 vCPUs (NFR-004).
      - name: VM quota preflight (gates provisioning)
        run: |
          source scripts/e2e/lib.sh
          # shellcheck disable=SC2153  # REGION comes from the job env (matrix.region)
          lib::az_vm_quota_preflight az "${PRIMARY_SUBSCRIPTION_ID}" "${REGION}" \
            "${VM_QUOTA_FAMILY}" "${VM_QUOTA_REQUIRED}"

      - name: Provision self-managed cluster (explicit subscription)
        id: provision
        env:
          SUBSCRIPTION_ID: ${{ env.PRIMARY_SUBSCRIPTION_ID }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/provision-cluster.sh all

      - name: Upload provisioning manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-provision-ss-${{ matrix.region }}
          path: run-manifest.json
          retention-days: 30

  # ===========================================================================
  # EPIC-003 - Same-subscription, run-scoped cross-region RBAC (ITEM-009).
  #
  # Grants both clusters' node identities the minimal `Network Contributor` role
  # on the PRIMARY run RG scope ONLY (never a subscription-scope grant), waits
  # for propagation with a bounded retry, records assignment IDs, and asserts no
  # subscription-scope grant references a run principal. The `xs` cross-subscription
  # variant (setup-cross-sub-rbac.sh) is EPIC-010.
  rbac:
    name: Cross-region RBAC (ss)
    needs: [meta, provision]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      TOPOLOGY: ss
      REGIONS: ${{ needs.meta.outputs.regions }}
      PRIMARY_SUBSCRIPTION_ID: ${{ inputs.primary_subscription_id || vars.E2E_PRIMARY_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Download run-manifest foundation
        uses: actions/download-artifact@v4
        with:
          name: run-manifest
          path: .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.PRIMARY_SUBSCRIPTION_ID }}

      - name: Grant run-scoped cross-region RBAC (RG-scoped, bounded propagation)
        id: rbac
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/cross-region-rbac.sh all

      - name: Upload RBAC manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-rbac-ss
          path: run-manifest.json
          retention-days: 30

  # ===========================================================================
  # EPIC-004 - Candidate deploy (ITEM-011 / ITEM-012).
  #
  # Per-region matrix that deploys the SAME candidate digest to each cluster.
  # kubectl runs ON the control-plane node via `az vm run-command` (the runner
  # has no path to the self-managed API server; the provisioning NSG admits 6443
  # from VirtualNetwork only). Each deploy mints a short-lived, repository-scoped
  # ACR token as the imagePullSecret (SEC-004/RD-004), applies CRD + RBAC +
  # manager@digest with CLUSTER_NAME set to the cluster RG (ownership-key match),
  # applies the documented PodASGMappings + Cluster-A/Cluster-B workloads
  # (CON-003), and establishes the baseline (A=4, B=0). Cloud steps are skipped
  # on pull_request (RD-009). `xs` deploy is EPIC-010.
  deploy:
    name: Deploy candidate ss / ${{ matrix.region }}
    needs: [meta, build, provision, rbac]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJSON(needs.meta.outputs.regions_json) }}
    env:
      TOPOLOGY: ss
      REGION: ${{ matrix.region }}
      PRIMARY_SUBSCRIPTION_ID: ${{ inputs.primary_subscription_id || vars.E2E_PRIMARY_SUBSCRIPTION_ID }}
      IMAGE_REFERENCE: ${{ needs.build.outputs.image_reference }}
      STAGING_ACR: ${{ vars.E2E_STAGING_ACR }}
    steps:
      - uses: actions/checkout@v4

      - name: Download run-manifest foundation
        uses: actions/download-artifact@v4
        with:
          name: run-manifest
          path: .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.PRIMARY_SUBSCRIPTION_ID }}

      - name: Deploy candidate + mappings + baseline (kubectl via run-command)
        id: deploy
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/deploy-controller.sh all

      - name: Upload deploy manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-deploy-ss-${{ matrix.region }}
          path: run-manifest.json
          retention-days: 30

  # ===========================================================================
  # EPIC-004 - Multi-cluster validation (ITEM-013 / ITEM-014).
  #
  # A SINGLE job (both clusters at once) that runs Tests 1-4 from
  # docs/multi-cluster-test-setup.md exactly per the documented pass criteria:
  # kubectl scale/status/log reads run ON each control-plane node via
  # `az vm run-command`, and ASG address-prefix-set membership is verified from
  # the runner with `az rest` (api 2025-07-01, CON-001), with bounded
  # reconciliation polling. Machine-readable per-test results are published into
  # run-manifest.json (AC-003..006). Diagnostics/cleanup and the release gate are
  # added by later epics.
  validate_multicluster:
    name: Validate multicluster (ss Tests 1-4)
    needs: [meta, deploy]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TOPOLOGY: ss
      PRIMARY_SUBSCRIPTION_ID: ${{ inputs.primary_subscription_id || vars.E2E_PRIMARY_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Download run-manifest foundation
        uses: actions/download-artifact@v4
        with:
          name: run-manifest
          path: .

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.PRIMARY_SUBSCRIPTION_ID }}

      - name: Run Tests 1-4 (kubectl via run-command; az rest prefix-set checks)
        id: validate
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          GIT_SHA: ${{ github.sha }}
          GIT_REF: ${{ github.ref }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/run-validation.sh all

      - name: Upload validation manifest (per-test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-validate-ss
          path: run-manifest.json
          retention-days: 30

  # ===========================================================================
  # EPIC-009 - Transparent-tunnel same-node enforcement (ITEM-033/030/031/032/034).
  #
  # Runs AFTER validate_multicluster on the SHARED centraluseuap cluster (RD-017):
  # installing transparent-tunnel and adding the deny rule mutate that cluster's
  # data plane, so the stock-CNI membership tests MUST complete first. This job
  # (1) pulls the candidate CNI artifact BY DIGEST and installs it on every
  # centraluseuap worker (control-plane excluded, TTS-001), (2) provisions the
  # NSG rules 190/200 + PodASGMappings, (3) runs TTS-001..TTS-007, publishing a
  # per-scenario result into the run manifest, and (4) ALWAYS collects CNI/network
  # diagnostics (FR-023). Any TTS failure fails the job and blocks release
  # (FR-022/AC-009). kubectl/worker access is via `az vm run-command`; ASG
  # membership is read from the runner with `az rest`.
  validate_tt:
    name: Validate transparent-tunnel (TTS-001..007)
    needs: [meta, build_cni, validate_multicluster]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      TOPOLOGY: ss
      REGION: centraluseuap
      PRIMARY_SUBSCRIPTION_ID: ${{ inputs.primary_subscription_id || vars.E2E_PRIMARY_SUBSCRIPTION_ID }}
      STAGING_ACR: ${{ vars.E2E_STAGING_ACR }}
      CNI_REFERENCE: ${{ needs.build_cni.outputs.cni_reference }}
    steps:
      - uses: actions/checkout@v4

      # Start from the build_cni manifest so artifacts.cni.* (reference, digest,
      # recorded checksum) is available to install-cni-tt.sh (NFR-010).
      - name: Download run-manifest (with candidate CNI digest)
        uses: actions/download-artifact@v4
        with:
          name: run-manifest-build-cni
          path: .

      - name: Install oras (OCI artifact pull by digest)
        uses: oras-project/setup-oras@v1

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ env.PRIMARY_SUBSCRIPTION_ID }}

      # 1) Install the validated CNI on every centraluseuap worker (CP excluded).
      - name: Install transparent-tunnel CNI on workers (digest-verified)
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/install-cni-tt.sh all

      # 2) Provision NSG rules 190/200 + PodASGMappings (test doc §3).
      - name: Provision transparent-tunnel enforcement fixtures
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/provision-tt-fixtures.sh all

      # 3) Run the seven enforcement scenarios; any failure fails the job.
      - name: Run TTS-001..TTS-007
        id: validate_tt
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          MANIFEST_PATH: run-manifest.json
        run: bash scripts/e2e/run-tt-validation.sh all

      # 4) ALWAYS collect CNI/network diagnostics so evidence exists on pass AND
      # forced-fail runs (FR-023/AC-007). The standalone EPIC-005 diagnostics job
      # (ITEM-015) also invokes this collector; wiring it here keeps CNI evidence
      # attached to validate_tt without coupling to that job.
      - name: Collect transparent-tunnel CNI/network diagnostics
        if: always()
        env:
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          DATE_UTC: ${{ needs.meta.outputs.date_utc }}
          MANIFEST_PATH: run-manifest.json
          CNI_DIAG_DIR: cni-diagnostics
        run: bash scripts/e2e/collect-cni-diagnostics.sh all

      - name: Upload CNI/network diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cni-diagnostics
          path: cni-diagnostics/
          retention-days: 30

      - name: Upload transparent-tunnel validation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-manifest-validate-tt
          path: run-manifest.json
          retention-days: 30

  naming-tests:
    name: Naming & metadata tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck e2e scripts
        run: shellcheck scripts/e2e/*.sh scripts/e2e/naming_test/*.sh

      - name: Run naming, lib, meta, build, provision, rbac, deploy, validation, and CNI/TT test suites
        run: |
          bash scripts/e2e/naming_test/naming_test.sh
          bash scripts/e2e/naming_test/lib_test.sh
          bash scripts/e2e/naming_test/meta_test.sh
          bash scripts/e2e/naming_test/build_test.sh
          bash scripts/e2e/naming_test/provision_cluster_test.sh
          bash scripts/e2e/naming_test/cross_region_rbac_test.sh
          bash scripts/e2e/naming_test/deploy_controller_test.sh
          bash scripts/e2e/naming_test/run_validation_test.sh
          bash scripts/e2e/naming_test/build_cni_test.sh
          bash scripts/e2e/naming_test/install_cni_tt_test.sh
          bash scripts/e2e/naming_test/provision_tt_fixtures_test.sh
          bash scripts/e2e/naming_test/run_tt_validation_test.sh
          bash scripts/e2e/naming_test/collect_cni_diagnostics_test.sh
          bash scripts/e2e/naming_test/promote_release_test.sh

      - name: Verify naming self-check
        run: bash scripts/e2e/naming.sh self-check
