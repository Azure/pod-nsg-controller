apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-nsg-controller
  namespace: pod-nsg-controller-system
  labels:
    app.kubernetes.io/name: pod-nsg-controller
    app.kubernetes.io/component: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pod-nsg-controller
  labels:
    app.kubernetes.io/name: pod-nsg-controller
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pod-nsg-controller
  labels:
    app.kubernetes.io/name: pod-nsg-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pod-nsg-controller
subjects:
  - kind: ServiceAccount
    name: pod-nsg-controller
    namespace: pod-nsg-controller-system
