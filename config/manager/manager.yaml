apiVersion: v1
kind: Namespace
metadata:
  name: pod-nsg-controller-system
  labels:
    app.kubernetes.io/name: pod-nsg-controller
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-nsg-controller-arm-tuning
  namespace: pod-nsg-controller-system
  labels:
    app.kubernetes.io/name: pod-nsg-controller
data:
  ARM_RATE_LIMIT_RPS: "20"
  MAX_CONCURRENT_ACTIONS: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-nsg-controller
  namespace: pod-nsg-controller-system
  labels:
    app.kubernetes.io/name: pod-nsg-controller
    app.kubernetes.io/component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pod-nsg-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pod-nsg-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: pod-nsg-controller
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: pod-nsg-controller:latest
          imagePullPolicy: Never
          args:
            - --leader-elect
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          env:
            - name: AZURE_SUBSCRIPTION_ID
              valueFrom:
                secretKeyRef:
                  name: pod-nsg-controller-azure
                  key: subscription-id
            - name: AZURE_RESOURCE_GROUP
              valueFrom:
                secretKeyRef:
                  name: pod-nsg-controller-azure
                  key: resource-group
            - name: AZURE_NSG_NAME
              valueFrom:
                secretKeyRef:
                  name: pod-nsg-controller-azure
                  key: nsg-name
            - name: ARM_TUNING_DIR
              value: "/etc/pod-nsg-controller/arm-tuning"
          volumeMounts:
            - name: arm-tuning
              mountPath: /etc/pod-nsg-controller/arm-tuning
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: 500m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: arm-tuning
          configMap:
            name: pod-nsg-controller-arm-tuning
